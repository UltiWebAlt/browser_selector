<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Browser Selector Icon Alternative</title>
  <desc id="desc">Playful split-window mark with selection pulse and orbiting tabs.</desc>
  <defs>
    <linearGradient id="card" x1="96" y1="88" x2="416" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9EE"/>
      <stop offset="1" stop-color="#F1F6FF"/>
    </linearGradient>
    <linearGradient id="topbar" x1="92" y1="96" x2="420" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6F61"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="pulse" x1="188" y1="188" x2="324" y2="324" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2CD4D9"/>
      <stop offset="1" stop-color="#007CF0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0E2240" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="100" fill="#0F2747"/>

  <g filter="url(#soft)">
    <rect x="92" y="92" width="328" height="328" rx="42" fill="url(#card)"/>
    <rect x="92" y="92" width="328" height="58" rx="42" fill="url(#topbar)"/>

    <circle cx="128" cy="121" r="8" fill="#FFE3DF"/>
    <circle cx="152" cy="121" r="8" fill="#FFEED5"/>
    <circle cx="176" cy="121" r="8" fill="#FFF7E4"/>

    <rect x="122" y="176" width="120" height="88" rx="16" fill="#DDE8F8"/>
    <rect x="270" y="176" width="120" height="88" rx="16" fill="#DDE8F8"/>
    <rect x="122" y="292" width="120" height="88" rx="16" fill="#DDE8F8"/>
    <rect x="270" y="292" width="120" height="88" rx="16" fill="#DDE8F8"/>

    <circle cx="330" cy="220" r="58" fill="none" stroke="#B7C9E6" stroke-width="10" stroke-dasharray="14 16"/>
    <circle cx="330" cy="220" r="44" fill="none" stroke="url(#pulse)" stroke-width="12"/>
    <path d="M316 220 L328 232 L352 208" fill="none" stroke="#0A1A34" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

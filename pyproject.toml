[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser_selector"
version = "1.4"
description = "Show a popup window to open URLs in the selected web browser."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyQt5>=5.15", "pyxdg>=0.28"]

[project.scripts]
browser-selector = "browser_selector:main"

[tool.pyright]
venvPath = "."
venv = ".venv"
